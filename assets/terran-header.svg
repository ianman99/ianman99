<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="metal-frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6577"/>
      <stop offset="12%" stop-color="#3a4455"/>
      <stop offset="50%" stop-color="#6a7a8c"/>
      <stop offset="88%" stop-color="#3a4455"/>
      <stop offset="100%" stop-color="#5a6577"/>
    </linearGradient>
    <linearGradient id="screen-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060a12"/>
      <stop offset="100%" stop-color="#0d1520"/>
    </linearGradient>
    <linearGradient id="inner-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#0a0e17"/>
    </linearGradient>
    <pattern id="scanlines" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="2" fill="rgba(0,255,65,0.02)"/>
      <rect y="2" width="1" height="2" fill="rgba(0,0,0,0.08)"/>
    </pattern>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="none" stroke="rgba(0,255,65,0.03)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Outer metal frame -->
  <rect x="0" y="0" width="900" height="300" rx="6" fill="url(#metal-frame)"/>

  <!-- Inner bevel -->
  <rect x="4" y="4" width="892" height="292" rx="4" fill="url(#inner-edge)" opacity="0.5"/>

  <!-- Screen -->
  <rect x="8" y="8" width="884" height="284" rx="3" fill="url(#screen-bg)"/>

  <!-- Grid -->
  <rect x="8" y="8" width="884" height="284" fill="url(#grid)" rx="3"/>

  <!-- Scanlines -->
  <rect x="8" y="8" width="884" height="284" fill="url(#scanlines)" rx="3"/>

  <!-- Bolts -->
  <circle cx="14" cy="14" r="5" fill="#4a5568" stroke="#2d3748" stroke-width="1.5"/>
  <circle cx="14" cy="14" r="2" fill="#2d3748"/>
  <circle cx="886" cy="14" r="5" fill="#4a5568" stroke="#2d3748" stroke-width="1.5"/>
  <circle cx="886" cy="14" r="2" fill="#2d3748"/>
  <circle cx="14" cy="286" r="5" fill="#4a5568" stroke="#2d3748" stroke-width="1.5"/>
  <circle cx="14" cy="286" r="2" fill="#2d3748"/>
  <circle cx="886" cy="286" r="5" fill="#4a5568" stroke="#2d3748" stroke-width="1.5"/>
  <circle cx="886" cy="286" r="2" fill="#2d3748"/>

  <!-- HUD corner brackets -->
  <path d="M 35 35 L 35 60" stroke="#00FF41" stroke-width="1.5" opacity="0.6"/>
  <path d="M 35 35 L 60 35" stroke="#00FF41" stroke-width="1.5" opacity="0.6"/>
  <path d="M 865 35 L 865 60" stroke="#00FF41" stroke-width="1.5" opacity="0.6"/>
  <path d="M 865 35 L 840 35" stroke="#00FF41" stroke-width="1.5" opacity="0.6"/>
  <path d="M 35 265 L 35 240" stroke="#00FF41" stroke-width="1.5" opacity="0.6"/>
  <path d="M 35 265 L 60 265" stroke="#00FF41" stroke-width="1.5" opacity="0.6"/>
  <path d="M 865 265 L 865 240" stroke="#00FF41" stroke-width="1.5" opacity="0.6"/>
  <path d="M 865 265 L 840 265" stroke="#00FF41" stroke-width="1.5" opacity="0.6"/>

  <!-- Top status bar -->
  <rect x="40" y="42" width="6" height="6" rx="1" fill="#00FF41" opacity="0.9"/>
  <text x="52" y="49" font-family="Courier New, monospace" font-size="10" fill="#00FF41" opacity="0.5" letter-spacing="1">SYS.ONLINE</text>

  <rect x="160" y="42" width="6" height="6" rx="1" fill="#00FF41" opacity="0.9"/>
  <text x="172" y="49" font-family="Courier New, monospace" font-size="10" fill="#00FF41" opacity="0.5" letter-spacing="1">POWER.NOMINAL</text>

  <text x="820" y="49" font-family="Courier New, monospace" font-size="10" fill="#FF8C00" opacity="0.6" text-anchor="end" letter-spacing="1">CLEARANCE: ALPHA</text>
  <rect x="828" y="42" width="6" height="6" rx="1" fill="#FF8C00" opacity="0.8"/>

  <!-- Top line -->
  <line x1="35" y1="56" x2="865" y2="56" stroke="#00FF41" stroke-width="0.5" opacity="0.25"/>

  <!-- TERRAN wing emblem (simplified) -->
  <path d="M 450 72 L 430 92 L 420 88 L 445 68 Z" fill="#00FF41" opacity="0.15"/>
  <path d="M 450 72 L 470 92 L 480 88 L 455 68 Z" fill="#00FF41" opacity="0.15"/>
  <path d="M 450 72 L 450 82" stroke="#00FF41" stroke-width="1" opacity="0.2"/>

  <!-- Main title -->
  <text x="450" y="128" text-anchor="middle" font-family="Courier New, monospace" font-size="52" font-weight="bold" fill="#00FF41" filter="url(#glow-strong)" letter-spacing="8">IANMAN99</text>

  <!-- Subtitle divider -->
  <line x1="220" y1="148" x2="380" y2="148" stroke="#00FF41" stroke-width="0.8" opacity="0.3"/>
  <rect x="390" y="144" width="8" height="8" rx="4" fill="none" stroke="#FF8C00" stroke-width="1" opacity="0.5"/>
  <rect x="404" y="144" width="8" height="8" rx="1" fill="#FF8C00" opacity="0.4"/>
  <rect x="418" y="144" width="8" height="8" rx="4" fill="none" stroke="#FF8C00" stroke-width="1" opacity="0.5"/>
  <line x1="436" y1="148" x2="440" y2="148" stroke="#FF8C00" stroke-width="1" opacity="0.4"/>
  <line x1="460" y1="148" x2="464" y2="148" stroke="#FF8C00" stroke-width="1" opacity="0.4"/>
  <rect x="474" y="144" width="8" height="8" rx="4" fill="none" stroke="#FF8C00" stroke-width="1" opacity="0.5"/>
  <rect x="488" y="144" width="8" height="8" rx="1" fill="#FF8C00" opacity="0.4"/>
  <rect x="502" y="144" width="8" height="8" rx="4" fill="none" stroke="#FF8C00" stroke-width="1" opacity="0.5"/>
  <line x1="520" y1="148" x2="680" y2="148" stroke="#00FF41" stroke-width="0.8" opacity="0.3"/>

  <!-- Role -->
  <text x="450" y="178" text-anchor="middle" font-family="Courier New, monospace" font-size="17" fill="#FF8C00" letter-spacing="4" filter="url(#glow)">TERRAN DOMINION</text>
  <text x="450" y="204" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#00FF41" opacity="0.7" letter-spacing="2">Quantitative Finance Developer ∙ Full-Stack Engineer</text>

  <!-- Bottom status -->
  <line x1="35" y1="240" x2="865" y2="240" stroke="#00FF41" stroke-width="0.5" opacity="0.25"/>

  <!-- Bottom bar indicators -->
  <rect x="40" y="252" width="50" height="3" rx="1" fill="#00FF41" opacity="0.3"/>
  <rect x="95" y="252" width="30" height="3" rx="1" fill="#FF8C00" opacity="0.2"/>
  <rect x="130" y="252" width="15" height="3" rx="1" fill="#00FF41" opacity="0.15"/>

  <text x="450" y="258" text-anchor="middle" font-family="Courier New, monospace" font-size="11" fill="#00FF41" opacity="0.45" letter-spacing="2">◈ COMMAND CENTER  ◈  ADJUTANT ONLINE  ◈  AWAITING ORDERS</text>

  <rect x="755" y="252" width="15" height="3" rx="1" fill="#00FF41" opacity="0.15"/>
  <rect x="775" y="252" width="30" height="3" rx="1" fill="#FF8C00" opacity="0.2"/>
  <rect x="810" y="252" width="50" height="3" rx="1" fill="#00FF41" opacity="0.3"/>
</svg>
